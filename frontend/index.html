<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5faf7" />
    <meta name="color-scheme" content="light" />

    <!-- HelpingPools Branding & SEO -->
    <title>HelpingPools | Community & Digital Platform</title>

    <meta
      name="description"
      content="Welcome to HelpingPools. Access your account, explore the platform, and manage your community dashboard."
    />

    <meta
      name="keywords"
      content="HelpingPools, community platform, digital platform, account dashboard"
    />

    <meta name="author" content="HelpingPools" />
    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://helpingpools.online/"
    />

    <!-- Website Favicon -->
    <link rel="icon" type="image/jpeg" href="/logo1.jpg" />
    <link rel="apple-touch-icon" href="/logo1.jpg" />

    <!-- Open Graph: WhatsApp, Facebook, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HelpingPools" />
    <meta property="og:url" content="https://helpingpools.online/" />

    <meta
      property="og:title"
      content="HelpingPools | Community & Digital Platform"
    />

    <meta
      property="og:description"
      content="Visit HelpingPools and access your community platform."
    />

    <!-- Add banner image when available -->
    <!--
    <meta
      property="og:image"
      content="https://helpingpools.online/og-banner.jpg"
    />
    -->

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="HelpingPools | Community & Digital Platform"
    />

    <meta
      name="twitter:description"
      content="Visit HelpingPools and access your community platform."
    />

    <!-- Security & Referrer -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
